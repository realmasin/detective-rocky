<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic Interrogation</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <div class="crt-overlay"></div>
        <div id="background" class="bg-blur"></div>

        <div id="top-status-bar">
            <span>SYS.OP: SEISMIC_OS_v3.0</span>
            <span id="random-hash">HASH: 0x00000000</span>
            <span class="blinking-dot">SECURE_LINK</span>
        </div>

        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <div id="story-text-container"></div>
            <button id="skip-btn" class="hidden">SKIP >></button>
            <div class="intro-buttons">
                <button id="ready-btn" class="cyber-btn hidden">INITIATE_CONNECTION</button>
            </div>
        </div>

        <!-- Identity Screen -->
        <div id="identity-screen" class="screen hidden">
            <div class="hud-panel identity-form fade-element">
                <div class="form-header">
                    <h2>SECURE LOGIN</h2>
                    <div class="glitch-line"></div>
                </div>
                <div class="input-group">
                    <label>> INPUT_AGENT_ALIAS:</label>
                    <input type="text" id="username-input" placeholder="e.g. GhostProtocol" autocomplete="off" maxlength="15">
                </div>
                <div class="input-group">
                    <label>> BIOMETRIC_DATA (UPLOAD PFP):</label>
                    <input type="file" id="pfp-input" accept="image/*">
                </div>
                <div id="identity-error" class="error-text hidden">ERR: CREDENTIALS REQUIRED</div>
                <button id="submit-identity-btn" class="cyber-btn full-width-btn">VERIFY & ENTER</button>
            </div>
        </div>

        <!-- Dialogue Screen -->
        <div id="dialogue-screen" class="screen hidden">
            <div class="dialogue-box hud-panel">
                <p id="rocky-dialogue"></p>
                <span class="type-cursor">_</span>
            </div>
        </div>

        <!-- Interrogation Screen -->
        <div id="interrogation-screen" class="screen hidden">
            <div class="top-section fade-element" id="q-container">
                <div class="timer-container">
                    <span class="timer-label">TIME_REMAINING: </span>
                    <span id="digital-timer">00:15:00</span>
                </div>
                <div class="question-box hud-panel">
                    <p id="question-text"></p>
                    <div id="image-wrapper" class="hidden">
                        <img id="question-image" src="" alt="Target Data">
                        <div class="scanner-line"></div>
                    </div>
                </div>
            </div>
            
            <div class="bottom-section fade-element" id="opt-container">
                <div class="options-grid">
                    <button class="option-btn hud-panel cyber-hover" data-index="0"></button>
                    <button class="option-btn hud-panel cyber-hover" data-index="1"></button>
                    <button class="option-btn hud-panel cyber-hover" data-index="2"></button>
                    <button class="option-btn hud-panel cyber-hover" data-index="3"></button>
                </div>
            </div>
        </div>

        <!-- Endgame Screen -->
        <div id="endgame-screen" class="screen hidden">
            <div id="prison-bars" class="hidden">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            
            <!-- Horizontal Twitter-Optimized ID Card -->
            <div id="card-wrapper" class="hidden">
                <div id="result-card" class="classified-card hud-panel">
                    <div class="card-left-accent"></div>
                    <div class="card-bg-texture"></div>
                    
                    <div class="card-content-horizontal">
                        <!-- Left Side: Photo -->
                        <div class="card-left-side">
                            <div class="card-photo-wrapper">
                                <img id="card-pfp" src="" alt="Subject Photo">
                                <div class="photo-scanner"></div>
                            </div>
                            <div class="barcode"></div>
                        </div>
                        
                        <!-- Right Side: Details -->
                        <div class="card-right-side">
                            <div class="card-header-hr">
                                <h2>SEISMIC INTELLIGENCE</h2>
                                <span>OFFICIAL DOSSIER</span>
                            </div>
                            
                            <div class="card-info-grid">
                                <div class="info-block">
                                    <span class="label">ALIAS</span>
                                    <span id="card-name" class="value">UNKNOWN</span>
                                </div>
                                <div class="info-block">
                                    <span class="label">ID NO.</span>
                                    <span id="card-id" class="value">SMC-0000</span>
                                </div>
                                <div class="info-block">
                                    <span class="label">ACCURACY</span>
                                    <span id="final-score" class="value highlight glow-text">0/8</span>
                                </div>
                                <div class="info-block">
                                    <span class="label">STATUS</span>
                                    <span id="card-status" class="value">EVALUATING</span>
                                </div>
                            </div>
                        </div>
                        
                        <div id="endgame-stamp" class="stamp"></div>
                    </div>
                </div>

                <div class="endgame-actions" id="action-buttons">
                    <button id="download-btn" class="cyber-btn">DOWNLOAD INTEL</button>
                    <button id="share-x-btn" class="cyber-btn x-btn">SHARE ON X</button>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div id="copyright-footer">
            &copy; 2026 masinonline. All rights reserved.
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>

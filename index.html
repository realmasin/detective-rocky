<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic Interrogation</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <!-- CRT Overlay Effect (Fixed for full screen) -->
        <div class="crt-overlay"></div>
        
        <!-- Background -->
        <div id="background" class="bg-blur"></div>

        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <div id="story-text-container"></div>
            <div class="intro-buttons">
                <button id="skip-btn" class="hidden">SKIP</button>
                <!-- Creative Cyber Button -->
                <button id="ready-btn" class="cyber-btn hidden">INITIATE_CONNECTION</button>
            </div>
        </div>

        <!-- Identity Screen -->
        <div id="identity-screen" class="screen hidden">
            <div class="hud-panel identity-form fade-element">
                <h2>IDENTIFICATION</h2>
                <p class="subtitle">Enter credentials for Room 7 access.</p>
                
                <div class="input-group">
                    <label>AGENT ID:</label>
                    <input type="text" id="username-input" placeholder="e.g. SeismicHacker" autocomplete="off" maxlength="15">
                </div>
                
                <div class="input-group">
                    <label>BIOMETRIC SCAN (PFP):</label>
                    <input type="file" id="pfp-input" accept="image/*">
                </div>
                
                <div id="identity-error" class="error-text hidden">CREDENTIALS MISSING!</div>
                
                <button id="submit-identity-btn" class="cyber-btn full-width-btn">VERIFY</button>
            </div>
        </div>

        <!-- Dialogue Screen (Moved to center, hint removed) -->
        <div id="dialogue-screen" class="screen hidden">
            <div class="dialogue-box hud-panel">
                <p id="rocky-dialogue"></p>
            </div>
        </div>

        <!-- Interrogation Screen -->
        <div id="interrogation-screen" class="screen hidden">
            
            <div class="top-section fade-element" id="q-container">
                <div class="timer-container">
                    <span class="timer-label">SYS_TIME: </span>
                    <span id="digital-timer">00:15:00</span>
                </div>
                <div class="question-box hud-panel">
                    <p id="question-text"></p>
                    <div id="image-wrapper" class="hidden">
                        <img id="question-image" src="" alt="Target Data">
                        <div class="scanner-line"></div>
                    </div>
                </div>
            </div>
            
            <div class="bottom-section fade-element" id="opt-container">
                <div class="options-grid">
                    <button class="option-btn hud-panel" data-index="0"></button>
                    <button class="option-btn hud-panel" data-index="1"></button>
                    <button class="option-btn hud-panel" data-index="2"></button>
                    <button class="option-btn hud-panel" data-index="3"></button>
                </div>
            </div>
        </div>

        <!-- Endgame Screen -->
        <div id="endgame-screen" class="screen hidden">
            <div id="prison-bars" class="hidden">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            
            <!-- Highly creative result card layout -->
            <div id="result-card" class="classified-card hud-panel">
                <div class="card-top-bar">CLASSIFIED DOSSIER</div>
                
                <div class="card-main">
                    <div class="card-photo-wrapper">
                        <img id="card-pfp" src="" alt="Subject Photo">
                        <div class="photo-overlay"></div>
                    </div>
                    
                    <div class="card-info">
                        <div class="info-row">
                            <span class="label">SUBJECT:</span>
                            <span id="card-name" class="value">UNKNOWN</span>
                        </div>
                        <div class="info-row">
                            <span class="label">ID NO:</span>
                            <span id="card-id" class="value">SMC-0000</span>
                        </div>
                        <div class="info-row">
                            <span class="label">INTEL SCORE:</span>
                            <span id="final-score" class="value highlight">0/8</span>
                        </div>
                        <div class="info-row">
                            <span class="label">THREAT LEVEL:</span>
                            <span id="card-status" class="value">EVALUATING</span>
                        </div>
                    </div>
                </div>
                
                <div class="card-bottom">
                    <div class="barcode"></div>
                </div>
                
                <!-- Stamp moved to avoid overlapping text -->
                <div id="endgame-stamp" class="stamp hidden"></div>
            </div>

            <div class="endgame-actions hud-panel fade-element hidden" id="action-buttons">
                <button id="download-btn">DOWNLOAD</button>
                <button id="share-x-btn">SHARE ON X</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>

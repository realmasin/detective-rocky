<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic Interrogation</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <!-- Animated Background -->
        <div id="background" class="bg-blur"></div>

        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <div id="story-text-container"></div>
            <div class="intro-buttons">
                <button id="skip-btn" class="hidden">Skip Intro</button>
                <button id="ready-btn" class="hidden">I am ready</button>
            </div>
        </div>

        <!-- Dialogue Screen -->
        <div id="dialogue-screen" class="screen hidden">
            <div class="dialogue-box">
                <p id="rocky-dialogue"></p>
                <p class="click-hint">Click anywhere to continue...</p>
            </div>
        </div>

        <!-- Interrogation Screen -->
        <div id="interrogation-screen" class="screen hidden">
            
            <!-- Top part: Timer and Question -->
            <div class="top-section fade-element" id="q-container">
                <div class="timer-bar"><div id="time-left"></div></div>
                <div class="question-box">
                    <p id="question-text"></p>
                    <img id="question-image" src="" alt="Question Image" class="hidden">
                </div>
            </div>
            
            <!-- Empty space to show Rocky's face -->
            <div class="spacer"></div>
            
            <!-- Bottom part: 2x2 Options Grid -->
            <div class="bottom-section fade-element" id="opt-container">
                <div class="options-grid">
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                </div>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

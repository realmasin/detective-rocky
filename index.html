<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic Interrogation</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <!-- CRT Overlay Effect -->
        <div class="crt-overlay"></div>
        
        <!-- Background -->
        <div id="background" class="bg-blur"></div>

        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <div id="story-text-container"></div>
            <div class="intro-buttons">
                <button id="skip-btn" class="hidden">[ SKIP_SEQUENCE ]</button>
                <button id="ready-btn" class="hidden">[ INITIATE_CONNECTION ]</button>
            </div>
        </div>

        <!-- Identity Screen -->
        <div id="identity-screen" class="screen hidden">
            <div class="hud-panel identity-form fade-element">
                <h2>IDENTIFICATION REQUIRED</h2>
                <p class="subtitle">Please provide your credentials before entering room 7.</p>
                
                <div class="input-group">
                    <label>AGENT NAME (USERNAME):</label>
                    <input type="text" id="username-input" placeholder="e.g. SeismicHacker99" autocomplete="off" maxlength="15">
                </div>
                
                <div class="input-group">
                    <label>UPLOAD PFP (AVATAR):</label>
                    <input type="file" id="pfp-input" accept="image/*">
                </div>
                
                <div id="identity-error" class="error-text hidden">ALL FIELDS ARE REQUIRED!</div>
                
                <button id="submit-identity-btn" class="full-width-btn">[ VERIFY_IDENTITY ]</button>
            </div>
        </div>

        <!-- Dialogue Screen -->
        <div id="dialogue-screen" class="screen hidden">
            <div class="dialogue-box hud-panel">
                <p id="rocky-dialogue"></p>
                <p class="click-hint">> CLICK TO CONTINUE_</p>
            </div>
        </div>

        <!-- Interrogation Screen (Layout Fixed) -->
        <div id="interrogation-screen" class="screen hidden">
            
            <div class="top-section fade-element" id="q-container">
                <div class="timer-container">
                    <span class="timer-label">TIME: </span>
                    <span id="digital-timer">00:15:00</span>
                </div>
                <div class="question-box hud-panel">
                    <p id="question-text"></p>
                    <div id="image-wrapper" class="hidden">
                        <img id="question-image" src="" alt="Target Data">
                        <div class="scanner-line"></div>
                    </div>
                </div>
            </div>
            
            <!-- Removed the huge spacer here to keep layout compact -->
            
            <div class="bottom-section fade-element" id="opt-container">
                <div class="options-grid">
                    <button class="option-btn hud-panel" data-index="0"></button>
                    <button class="option-btn hud-panel" data-index="1"></button>
                    <button class="option-btn hud-panel" data-index="2"></button>
                    <button class="option-btn hud-panel" data-index="3"></button>
                </div>
            </div>
        </div>

        <!-- Endgame Screen -->
        <div id="endgame-screen" class="screen hidden">
            <div id="prison-bars" class="hidden">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            
            <div id="result-card" class="result-card hud-panel">
                <div class="card-header">SEISMIC INTERROGATION REPORT</div>
                <div class="card-body">
                    <div class="card-avatar">
                        <img id="card-pfp" src="" alt="Agent PFP">
                    </div>
                    <div class="card-details">
                        <p><strong>NAME:</strong> <span id="card-name">UNKNOWN</span></p>
                        <p><strong>SCORE:</strong> <span id="final-score" class="highlight">0/8</span></p>
                        <p><strong>STATUS:</strong> <span id="card-status">PENDING</span></p>
                    </div>
                </div>
                <div id="endgame-stamp" class="stamp hidden"></div>
            </div>

            <div class="endgame-actions hud-panel fade-element hidden" id="action-buttons">
                <button id="download-btn">[ DOWNLOAD_CARD ]</button>
                <button id="share-x-btn">[ SHARE_ON_X ]</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>

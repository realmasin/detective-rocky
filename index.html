<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic Interrogation</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="transition-overlay"></div>

    <div id="game-container">
        
        <div class="crt-overlay"></div>
        <div id="glitch-overlay"></div>
        <div id="background" class="bg-blur"></div>

        <div id="top-status-bar">
            <span>SEISMIC_SYS // DEPT-7</span>
            <span id="random-hash">AUTH: 0x0000</span>
            <span class="blinking-dot">LIVE</span>
        </div>

        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <div class="terminal-window">
                <div class="terminal-body" id="story-text-container"></div>
            </div>
            
            <button id="skip-btn" class="hidden">SKIP >></button>
            <div class="intro-buttons">
                <button id="ready-btn" class="cyber-btn hidden">
                    <span class="btn-text">CONNECT_TO_TERMINAL</span>
                </button>
            </div>
        </div>

        <!-- Identity Screen -->
        <div id="identity-screen" class="screen hidden">
            <div class="hud-panel identity-form fade-element">
                <div class="form-header">
                    <h2>SECURITY CLEARANCE</h2>
                    <div class="glitch-line"></div>
                </div>
                <div class="input-group">
                    <label>> AGENT_ALIAS:</label>
                    <input type="text" id="username-input" placeholder="Enter codename" autocomplete="off" maxlength="15">
                </div>
                <div class="input-group">
                    <label>> BIOMETRIC_SCAN (UPLOAD):</label>
                    <input type="file" id="pfp-input" accept="image/*">
                </div>
                <div id="identity-error" class="error-text hidden">ERR: ALL FIELDS REQUIRED</div>
                <button id="submit-identity-btn" class="cyber-btn full-width-btn">VERIFY IDENTITY</button>
            </div>
        </div>

        <!-- Dialogue Screen (Redesigned) -->
        <div id="dialogue-screen" class="screen hidden">
            <div class="cinematic-subtitle">
                <span class="bracket">[</span>
                <p id="rocky-dialogue"></p>
                <span class="type-cursor">_</span>
                <span class="bracket">]</span>
            </div>
        </div>

        <!-- Interrogation Screen -->
        <div id="interrogation-screen" class="screen hidden">
            <div class="top-section fade-element" id="q-container">
                <div class="timer-container">
                    <span class="timer-label">SYS_TIME: </span>
                    <span id="digital-timer">00:15:00</span>
                </div>
                <div class="question-box hud-panel">
                    <p id="question-text"></p>
                    <div id="image-wrapper" class="hidden">
                        <img id="question-image" src="" alt="Target Data">
                        <div class="scanner-line"></div>
                    </div>
                </div>
            </div>
            
            <div class="bottom-section fade-element" id="opt-container">
                <div class="options-grid">
                    <button class="option-btn hud-panel cyber-hover" data-index="0"></button>
                    <button class="option-btn hud-panel cyber-hover" data-index="1"></button>
                    <button class="option-btn hud-panel cyber-hover" data-index="2"></button>
                    <button class="option-btn hud-panel cyber-hover" data-index="3"></button>
                </div>
            </div>
        </div>

        <!-- Endgame Screen -->
        <div id="endgame-screen" class="screen hidden">
            <div id="prison-bars" class="hidden">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            
            <div id="card-scale-wrapper" class="hidden">
                <div class="twitter-card-container">
                    <div id="result-card" class="twitter-card">
                        
                        <div class="tc-bg-texture"></div>
                        <div class="tc-radar-grid"></div>
                        <div class="tc-watermark">SEISMIC DEPT.7</div>
                        
                        <div class="tc-header">
                            <div class="tc-logo"></div>
                            <span>OFFICIAL INTELLIGENCE DOSSIER</span>
                            <div class="tc-date" id="tc-hash">ID: 00000000</div>
                        </div>
                        
                        <div class="tc-body">
                            <div class="tc-profile-col">
                                <div class="tc-frame">
                                    <img id="card-pfp" src="" alt="Subject">
                                    <div class="tc-crosshair"></div>
                                    <div class="tc-scan"></div>
                                </div>
                                <div class="tc-barcode"></div>
                            </div>
                            
                            <div class="tc-data-col">
                                <div class="tc-data-row">
                                    <span class="tc-label">SUBJECT ALIAS:</span>
                                    <span id="card-name" class="tc-value tc-highlight">UNKNOWN</span>
                                </div>
                                
                                <div class="tc-data-row">
                                    <span class="tc-label">AGENT ID:</span>
                                    <span id="card-id" class="tc-value">SMC-0000</span>
                                </div>
                                
                                <div class="tc-data-row">
                                    <span class="tc-label">INTELLIGENCE ACCURACY:</span>
                                    <div class="tc-score-wrap">
                                        <span id="final-score" class="tc-value">0/8</span>
                                        <div class="tc-bar-bg"><div id="score-progress" class="tc-bar-fill"></div></div>
                                    </div>
                                </div>
                                
                                <div class="tc-data-row">
                                    <span class="tc-label">FINAL DIRECTIVE:</span>
                                    <span id="card-status" class="tc-value">EVALUATING...</span>
                                </div>
                            </div>
                        </div>
                        
                        <div id="endgame-stamp" class="tc-stamp"></div>
                    </div>
                </div>

                <div class="endgame-actions" id="action-buttons">
                    <button id="download-btn" class="cyber-btn">DOWNLOAD DOSSIER</button>
                    <button id="share-x-btn" class="cyber-btn x-btn">SHARE ON X</button>
                </div>
            </div>
        </div>
        
        <div id="copyright-footer">
            &copy; masinonline
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
